controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# ================= ARM CONTROLLER =================
arm_controller:
  ros__parameters:
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6

    command_interfaces:
      - position

    state_interfaces:
      - position

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5

      joint2_to_joint1: {trajectory: 0.2, goal: 0.1}
      joint3_to_joint2: {trajectory: 0.2, goal: 0.1}
      joint4_to_joint3: {trajectory: 0.2, goal: 0.1}
      joint5_to_joint4: {trajectory: 0.2, goal: 0.1}
      joint6_to_joint5: {trajectory: 0.2, goal: 0.1}
      joint6output_to_joint6: {trajectory: 0.2, goal: 0.1}


# ================= GRIPPER CONTROLLER =================
gripper_controller:
  ros__parameters:
    joints:
      - gripper_controller   # main actuated joint

    command_interfaces:
      - position

    state_interfaces:
      - position

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5

      gripper_controller: {trajectory: 0.01, goal: 0.005}
